# One-time seed of local tracking history into the MLflow volume.
#
# On the machine that has ./mlflow-seed/ (laptop after prepare, or EC2 after scp):
#   docker compose -f docker-compose.yml -f docker-compose.seed.yml up -d --build mlflow
#
# After the UI shows your experiments, you can drop the seed file and run:
#   docker compose up -d mlflow
# The named volume keeps the data. New local training should target the EC2 URI
# (MLFLOW_TRACKING_URI) so runs stream into that same volume.

services:
  mlflow:
    volumes:
      - mlflow-data:/mlflow
      - ./mlflow-seed:/seed:ro
