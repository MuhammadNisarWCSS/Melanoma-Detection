name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch to keep CI fast (no CUDA required)
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/cancer_detection tests scripts
          ruff format --check src/cancer_detection tests scripts

      - name: Type-check with mypy
        run: mypy src/cancer_detection
        continue-on-error: true   # non-blocking until mypy baseline is established

      - name: Run unit tests
        run: pytest tests/unit -v --cov=src/cancer_detection --cov-report=xml

      - name: Run integration tests
        run: pytest tests/integration -v
        env:
          # Prevent any accidental network calls during tests
          KAGGLE_USERNAME: "ci_mock"
          KAGGLE_KEY: "ci_mock"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
