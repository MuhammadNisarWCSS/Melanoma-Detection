# Smoke-test configuration: 2 batches, no GPU required, finishes in <60s
# Defaults to the hosted EC2 MLflow (same as training/default.yaml).
# Override with MLFLOW_TRACKING_URI or training.mlflow_uri=http://localhost:5000 for a local server.
# CI does not use this file — tests/integration/test_training_smoke.py builds its own config.
epochs: 2
batch_size: 4
lr: 1.0e-3
weight_decay: 1.0e-4
precision: "32"               # CPU-compatible; AMP not needed for smoke tests
early_stopping_patience: 2
deterministic: true
focal_gamma: 2.0
focal_alpha: 0.25
seed: 42
experiment_name: melanoma-smoke
mlflow_uri: "http://18.219.3.159:5000"  # same hosted server as full runs; separate experiment keeps smoke runs out of the way
fast_dev_run: true
