server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Container listens on :80 but is published as host :3000. Absolute
    # redirects would omit the non-default external port (Location loses :3000).
    absolute_redirect off;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI — browser uses VITE_API_URL=/api
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # MLflow REST/UI — browser uses VITE_MLFLOW_URL=/mlflow/
    # Exact /mlflow (no slash) must redirect relatively so host:3000 is kept.
    location = /mlflow {
        return 301 /mlflow/;
    }

    location /mlflow/ {
        proxy_pass http://mlflow:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
