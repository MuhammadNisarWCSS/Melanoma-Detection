[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cancer-detection"
version = "0.1.0"
description = "Production-ready melanoma detection from dermoscopy images using ISIC 2020"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "lightning>=2.3.0",
    "timm>=1.0.3",
    "albumentations>=1.4.14,<2.0",
    "mlflow>=2.14.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "hydra-core>=1.3.2",
    "grad-cam>=1.5.0",
    "structlog>=24.4.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "Pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "torchmetrics>=1.4.0",
    "opencv-python-headless>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
    "ipykernel>=6.29.0",
    "notebook>=7.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "types-Pillow",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cancer_detection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["cancer_detection"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
